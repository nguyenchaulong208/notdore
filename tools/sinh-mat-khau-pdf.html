<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinh mật khẩu PDF — NotDore</title>
  <meta name="description" content="Công cụ sinh mật khẩu ngẫu nhiên cho file PDF — chọn số ký tự, copy kết quả, xuất file txt">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../assets/css/notdore.css">
  <link rel="stylesheet" href="../assets/css/tools.css">
    <meta name="google-adsense-account" content="ca-pub-9767208027997083">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9767208027997083" crossorigin="anonymous"></script>
</head>
<body>
  <div class="anime-container">
    <header class="anime-header">
      <a class="anime-brand" href="../index.html">
      <div class="anime-brand-text">
        <span class="brand-fragment">Not</span>
        <span class="brand-fragment brand-fragment--main">Dore</span>
      </div>
    </a>
      <nav class="anime-nav" aria-label="Điều hướng chính">
        <a href="../index.html" class="anime-nav-link" aria-current="page">Công cụ</a>
        <a href="../bai-viet" class="anime-nav-link">Bài viết</a>
        <a href="../thu-vien.html" class="anime-nav-link">Thư viện</a>
        <a href="../contact.html" class="anime-nav-link">Liên hệ</a>
      </nav>
    </header>

    <main class="site-section">
      <div class="container" style="max-width: 700px;">
        <h1 class="site-section-heading">Sinh mật khẩu PDF</h1>
        <p class="site-section-sub">Tạo mật khẩu ngẫu nhiên cho file PDF — chọn độ dài, copy hoặc xuất file txt</p>
<p class="nd-tool-guide-link"><a href="../bai-viet/sinh-mat-khau-pdf-an-toan.html"><i class="fas fa-book-open" aria-hidden="true"></i> Đọc hướng dẫn chi tiết</a></p>

        <!-- Settings -->
        <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:1.5rem; margin-bottom:1.5rem;">
          <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:1rem;">Cài đặt</h3>

          <div style="margin-bottom:1rem;">
            <label style="font-size:.85rem; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:.4rem;">Số lượng ký tự</label>
            <input id="pwd-length" type="number" value="12" min="4" max="128" style="width:100%; padding:.6rem .8rem; border:2px solid var(--border); border-radius:var(--radius-sm); font-size:.9rem; background:var(--bg-input); color:var(--text-primary);">
          </div>

          <div style="margin-bottom:1rem;">
            <label style="font-size:.85rem; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:.4rem;">Số lượng mật khẩu cần sinh</label>
            <input id="pwd-count" type="number" value="1" min="1" max="50" style="width:100%; padding:.6rem .8rem; border:2px solid var(--border); border-radius:var(--radius-sm); font-size:.9rem; background:var(--bg-input); color:var(--text-primary);">
          </div>

          <div style="margin-bottom:1rem;">
            <label style="font-size:.85rem; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:.5rem;">Loại ký tự</label>
            <div style="display:flex; flex-wrap:wrap; gap:.75rem;">
              <label style="display:flex; align-items:center; gap:.4rem; font-size:.85rem; cursor:pointer;">
                <input type="checkbox" id="pwd-upper" checked> Chữ hoa (A-Z)
              </label>
              <label style="display:flex; align-items:center; gap:.4rem; font-size:.85rem; cursor:pointer;">
                <input type="checkbox" id="pwd-lower" checked> Chữ thường (a-z)
              </label>
              <label style="display:flex; align-items:center; gap:.4rem; font-size:.85rem; cursor:pointer;">
                <input type="checkbox" id="pwd-numbers" checked> Số (0-9)
              </label>
              <label style="display:flex; align-items:center; gap:.4rem; font-size:.85rem; cursor:pointer;">
                <input type="checkbox" id="pwd-symbols"> Ký tự đặc biệt (!@#$%...)
              </label>
            </div>
          </div>

          <button id="generate-btn" class="btn-primary-nd" style="width:100%; padding:.7rem; font-size:.95rem; justify-content:center;">
            <i class="fas fa-key me-1"></i> Sinh mật khẩu
          </button>
        </div>

        <!-- Results -->
        <div id="results-wrap" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.75rem; flex-wrap:wrap; gap:.5rem;">
            <h3 style="font-size:1.1rem; font-weight:700; margin:0;">Kết quả</h3>
            <div style="display:flex; gap:.5rem;">
              <button id="copy-all-btn" class="btn-outline-nd" style="padding:.4rem .8rem; font-size:.8rem;">
                <i class="fas fa-copy me-1"></i> Copy tất cả
              </button>
              <button id="export-txt-btn" class="btn-outline-nd" style="padding:.4rem .8rem; font-size:.8rem;">
                <i class="fas fa-file-export me-1"></i> Xuất file TXT
              </button>
            </div>
          </div>
          <div id="password-list" style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:1rem; font-family:monospace; font-size:1rem;"></div>
        </div>
      </div>
    </main>

    <footer class="anime-footer">
      <p>NotDore — Theodore.</p>
      <p>
        <a href="../index.html">Trang chủ</a> ·
        <a href="../about.html">Giới thiệu</a> ·
        <a href="../privacy.html">Chính sách bảo mật</a> ·
        <a href="../contact.html">Liên hệ</a>
      </p>
      <span id="online-badge" class="nd-online-badge" title="Số ngườời đang trực tuyến (cập nhật mỗi 15 giây)"><span class="nd-online-dot" aria-hidden="true"></span><span class="nd-online-label">Đang trực tuyến</span><span class="nd-online-sep" aria-hidden="true">&middot;</span><span class="nd-online-num">&hellip;</span><span class="nd-online-unit">ngườời</span></span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../assets/js/sinh-mat-khau-pdf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/online-counter.js"></script>
  </body>
</html>
