<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu hóa đơn điện tử — NotDore</title>
  <meta name="description" content="Danh sách link tra cứu hóa đơn điện tử, biên lai — tra cứu nhanh theo tên, loại">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../assets/css/notdore.css">
  <link rel="stylesheet" href="../assets/css/tools.css">
</head>
<body>
  <div class="anime-container">
    <header class="anime-header">
      <a class="anime-brand" href="../index.html">
        <div class="anime-brand-text">
          <span class="brand-fragment">Not</span>
          <span class="brand-fragment brand-fragment--main">Dore</span>
        </div>
      </a>
      <nav class="anime-nav" aria-label="Điều hướng chính">
        <a href="../index.html" class="anime-nav-link" aria-current="page">Công cụ</a>
        <a href="../thu-vien.html" class="anime-nav-link">Thư viện</a>
        <a href="../contact.html" class="anime-nav-link">Liên hệ</a>
      </nav>
    </header>

    <main class="site-section">
      <div class="container" style="max-width: 900px;">
        <h1 class="site-section-heading">Tra cứu hóa đơn điện tử</h1>
        <p class="site-section-sub">Danh sách link tra cứu hóa đơn, biên lai điện tử — tra cứu nhanh theo tên, loại</p>

        <div style="display:flex; gap:.75rem; margin-bottom:1.5rem; flex-wrap:wrap;">
          <div style="flex:1; min-width:200px; position:relative;">
            <i class="fas fa-magnifying-glass" style="position:absolute; left:.8rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
            <input id="search-input" type="search" placeholder="Tìm theo tên, loại..." style="width:100%; padding:.6rem .8rem .6rem 2.4rem; border:2px solid var(--border); border-radius:var(--radius-sm); font-size:.9rem; background:var(--bg-input); color:var(--text-primary);">
          </div>
          <select id="filter-type" style="padding:.6rem 1rem; border:2px solid var(--border); border-radius:var(--radius-sm); font-size:.85rem; background:var(--bg-input); color:var(--text-primary);">
            <option value="all">Tất cả loại</option>
          </select>
        </div>

        <div id="link-list" style="display:grid; gap:.75rem;"></div>
        <div id="empty-state" style="text-align:center; padding:3rem 1rem; color:var(--text-muted); display:none;">
          <i class="fas fa-search me-2"></i>Không tìm thấy link phù hợp.
        </div>
      </div>
    </main>

    <footer class="anime-footer">
      <p>NotDore — Theodore.</p>
      <p>
        <a href="../index.html">Trang chủ</a> ·
        <a href="../about.html">Giới thiệu</a> ·
        <a href="../privacy.html">Chính sách bảo mật</a> ·
        <a href="../contact.html">Liên hệ</a>
      </p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script>
  const $ = (id) => document.getElementById(id);
  let INVOICE_LINKS = [];
  let currentFilter = 'all';

  async function loadData() {
    try {
      const res = await fetch('../assets/data/invoice-links.json');
      INVOICE_LINKS = await res.json();
    } catch (e) {
      INVOICE_LINKS = [];
    }
    initFilterTypes();
    renderLinks();
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderLinks() {
    const q = ($('search-input').value || '').toLowerCase().trim();
    const filtered = INVOICE_LINKS.filter(l => {
      if (currentFilter !== 'all' && l.type !== currentFilter) return false;
      if (!q) return true;
      return [l.name, l.type, l.url, l.note].join(' ').toLowerCase().includes(q);
    });

    const host = $('link-list');
    const empty = $('empty-state');

    if (!filtered.length) { host.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    host.innerHTML = filtered.map(l => `
      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:1rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
        <div style="flex:1; min-width:200px;">
          <div style="display:flex; align-items:center; gap:.5rem; margin-bottom:.2rem;">
            <span style="font-weight:600; color:var(--text-primary);">${esc(l.name)}</span>
            <span class="nd-pill nd-pill--soft" style="font-size:.7rem;">${esc(l.type)}</span>
          </div>
          ${l.note ? `<div style="font-size:.8rem; color:var(--text-muted); margin-bottom:.3rem;">${esc(l.note)}</div>` : ''}
          <a href="${esc(l.url)}" target="_blank" rel="noopener" style="font-size:.82rem; color:var(--accent-purple); word-break:break-all;">${esc(l.url)}</a>
        </div>
        <div style="display:flex; gap:.4rem;">
          <a href="${esc(l.url)}" target="_blank" rel="noopener" class="btn-primary-nd" style="padding:.35rem .7rem; font-size:.8rem;">
            <i class="fas fa-external-link-alt"></i> Mở
          </a>
          <button class="copy-url" data-url="${esc(l.url)}" style="background:none; border:1px solid var(--border); border-radius:8px; padding:.35rem .6rem; cursor:pointer; color:var(--text-secondary); font-size:.8rem;" title="Copy URL">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>
    `).join('');

    host.querySelectorAll('.copy-url').forEach(btn => {
      btn.addEventListener('click', (e) => {
        navigator.clipboard.writeText(e.currentTarget.dataset.url).then(() => {
          e.currentTarget.innerHTML = '<i class="fas fa-check" style="color:var(--accent-green);"></i>';
          setTimeout(() => { e.currentTarget.innerHTML = '<i class="fas fa-copy"></i>'; }, 1500);
        });
      });
    });
  }

  function initFilterTypes() {
    const types = [...new Set(INVOICE_LINKS.map(l => l.type))].sort();
    const sel = $('filter-type');
    types.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  $('search-input').addEventListener('input', renderLinks);
  $('filter-type').addEventListener('change', (e) => { currentFilter = e.target.value; renderLinks(); });

  loadData();
  </script>
</body>
</html>
