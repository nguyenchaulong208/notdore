<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Chi tiết công cụ - NotDore</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chi tiết công cụ làm việc trên NotDore">
    <link rel="shortcut icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css?family=Quicksand:700|Roboto:400,400i,700&display=swap" rel="stylesheet">
    <script defer src="assets/fontawesome/js/all.min.js"></script>
    <link id="theme-style" rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/tools.css">
    <style>
        .tool-detail-section { padding: 2.5rem 0 4rem; }
        .tool-detail-layout { display: flex; gap: 2rem; align-items: flex-start; }
        .tool-side-panel { flex: 0 0 280px; max-width: 280px; position: sticky; top: 1.5rem; }
        .tool-main-panel { flex: 1 1 auto; min-width: 0; }
        .tool-side-panel .panel-block { background: #fff; border-radius: .75rem; box-shadow: 0 .125rem .5rem rgba(0,0,0,.06); padding: 1.25rem; margin-bottom: 1.25rem; }
        .tool-side-panel .panel-block h4 { font-size: .95rem; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 1rem; color: var(--bs-primary, #5029ce); }
        .related-tool-item a { display: block; padding: .5rem 0; border-bottom: 1px solid #eee; text-decoration: none; color: inherit; }
        .related-tool-item:last-child a { border-bottom: none; }
        .related-tool-item a:hover { color: var(--bs-primary, #5029ce); }
        .back-link { display: inline-flex; align-items: center; gap: .4rem; margin-bottom: 1.25rem; font-size: .9rem; }
        /* Typography cho bài viết Markdown nhúng từ GitHub */
        .tool-article { line-height: 1.75; }
        .tool-article h1, .tool-article h2, .tool-article h3 { margin: 1.75rem 0 .75rem; font-weight: 700; }
        .tool-article p, .tool-article ul, .tool-article ol, .tool-article table { margin-bottom: 1rem; }
        .tool-article img { max-width: 100%; border-radius: .5rem; }
        .tool-article pre { background: #f5f5f7; padding: 1rem; border-radius: .5rem; overflow-x: auto; }
        .tool-article code { background: #f5f5f7; padding: .1rem .35rem; border-radius: .3rem; }
        .tool-article pre code { background: none; padding: 0; }
        .tool-article blockquote { border-left: 4px solid var(--bs-primary, #5029ce); padding-left: 1rem; color: #555; }
        .tool-article table { width: 100%; border-collapse: collapse; }
        .tool-article th, .tool-article td { border: 1px solid #e0e0e0; padding: .5rem .75rem; }
        .tool-article-source { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed #ddd; font-size: .85rem; color: #777; }
        @media (max-width: 991.98px) {
            .tool-detail-layout { flex-direction: column; }
            .tool-side-panel { flex: 1 1 auto; max-width: 100%; position: static; width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="branding"><div class="container-fluid position-relative py-3"><div class="logo-wrapper"><div class="site-logo">
            <a class="navbar-brand" href="index.html"><img class="logo-icon me-2" src="assets/images/site-logo.svg" alt="logo"><span class="logo-text">NotDore</span></a>
        </div></div></div></div>
    </header>

    <section class="tool-detail-section">
        <div class="container">
            <a href="tools.html" class="back-link"><i class="fas fa-arrow-left"></i>Quay lại danh sách công cụ</a>

            <div id="tool-detail-state">
                <p class="tool-state text-center"><i class="fas fa-spinner fa-spin me-2"></i>Đang tải thông tin công cụ...</p>
            </div>

            <div id="tool-detail-layout" class="tool-detail-layout d-none">
                <!-- Panel trái: tùy biến, mặc định = danh mục + công cụ liên quan (xem renderSidePanel trong JS) -->
                <aside class="tool-side-panel" id="tool-side-panel"></aside>
                <main class="tool-main-panel" id="tool-main-panel"></main>
            </div>
        </div>
    </section>

    <footer class="footer"><div class="footer-bottom text-center py-5"><small class="copyright">Designed with ❤️ by Xiaoying Riley — Customized for NotDore</small></div></footer>

    <script src="assets/plugins/popper.min.js"></script>
    <script src="assets/plugins/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/plugins/smoothscroll.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="assets/js/tool-detail.js"></script>
</body>
</html>
